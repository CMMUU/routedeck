name: Release display metadata

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Update display titles, notes and labels only; preserve all binaries and tags
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: serylane-release-display
  cancel-in-progress: false

jobs:
  display:
    if: github.repository == 'CMMUU/serylane' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts -p 'test_release_display.py' -b
      - name: Verify and normalize display metadata on both channels
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          APPLY_DISPLAY: ${{ inputs.apply }}
        run: |
          args=(--gitee)
          if [ "$APPLY_DISPLAY" = "true" ]; then args+=(--apply); fi
          python3 scripts/release_display.py "${args[@]}"
  website:
    needs: display
    if: inputs.apply == true
    uses: ./.github/workflows/website.yml
    with:
      deploy: true
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
